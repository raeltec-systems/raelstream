name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: raelstream
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: raelstream
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U raelstream" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker pull bluenviron/mediamtx:1.21.1-ffmpeg
      - run: pnpm test:e2e
        env:
          CI: '1'
      # The same spine with the contribution forced through a TURN relay (the Codespaces topology).
      - run: docker pull coturn/coturn:4.7
      - run: pnpm exec playwright test wp0-spine
        env:
          CI: '1'
          RS_E2E_RELAY: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 14

  media:
    # Real FFmpeg/MediaMTX media-node suite (M2): conformance, A/V sync, isolation, fallback, stop.
    runs-on: ubuntu-24.04
    needs: check
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: raelstream
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: raelstream
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U raelstream" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker pull bluenviron/mediamtx:1.21.1-ffmpeg && docker pull node:24-alpine
      - run: pnpm test:media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-media-evidence
          path: test-results/m2-media-evidence.json
