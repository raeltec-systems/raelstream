# Raelstream single-VM stack (SPEC §15.2). Image versions are pinned in infra/VERSIONS.md;
# replace tags with digests when deploying.
name: raelstream

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: raelstream
      POSTGRES_DB: raelstream
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raelstream']
      interval: 5s
      retries: 10
    # no published ports: database stays private

  control:
    build: { context: ../.., dockerfile: infra/compose/control.Dockerfile }
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
    # Read-only view of MediaMTX's recordings, for the owner's downloads (SPEC §12.7).
    volumes: [recordings:/var/lib/raelstream/recordings:ro]
    deploy:
      resources: { limits: { cpus: '1.0', memory: 512M } }

  supervisor:
    # Build the bundle first: pnpm --filter @raelstream/supervisor build (see infra/scripts)
    build: { context: ../.., dockerfile: infra/compose/supervisor.Dockerfile }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_RTSP: rtsp://mediamtx:8554
      MEDIAMTX_RTMP: rtmp://mediamtx:1935
      MEDIAMTX_INTERNAL_USER: ${MEDIAMTX_INTERNAL_USER}
      MEDIAMTX_INTERNAL_PASS: ${MEDIAMTX_INTERNAL_PASS}
      RS_SEAL_PUBLIC_KEY: ${RS_SEAL_PUBLIC_KEY}
      RS_SEAL_SECRET_KEY_FILE: /run/secrets/seal_secret
    secrets: [seal_secret]
    volumes: [slates:/var/lib/raelstream/slates]
    depends_on:
      postgres: { condition: service_healthy }
      mediamtx: { condition: service_started }
    deploy:
      resources: { limits: { cpus: '3.0', memory: 2G } }

  mediamtx:
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    restart: unless-stopped
    volumes:
      - ../media/mediamtx.yml:/mediamtx.yml:ro
      - slates:/var/lib/raelstream/slates:ro
      - recordings:/var/lib/raelstream/recordings
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_IP:?set PUBLIC_IP in .env}
      MTX_WEBRTCTRUSTEDPROXIES: 172.16.0.0/12
    ports:
      - '8189:8189/udp'
      - '8189:8189/tcp'
    depends_on: [control]

  caddy:
    build: { context: ../.., dockerfile: infra/compose/caddy.Dockerfile }
    restart: unless-stopped
    env_file: [.env]
    ports: ['80:80', '443:443']
    volumes: [caddydata:/data]
    depends_on: [control, mediamtx]

secrets:
  pg_password:
    file: ./secrets/pg_password
  # Sealed-box secret key: only the supervisor can decrypt stream keys (SPEC §14.2). Not in backups.
  seal_secret:
    file: ./secrets/seal_secret

volumes:
  pgdata:
  caddydata:
  slates:
  recordings:
